# Set strategy to "1", "2", or "3". Paths may be absolute or relative to this directory.
strategy: "1"
outdir: results
threads: 8

tools:
  samtools: samtools
  minimap2: minimap2
  syri: syri
  bcftools: bcftools
  bwa: bwa
  gatk: gatk
  fastp: fastp
  primer3_core: primer3_core
  exonerate: exonerate
  bedtools: bedtools
  mafft: mafft
  python: python3

primer3:
  # Parameters transcribed from the Nature Protocols manuscript (Table 12).
  flank: 400                     # Sequence on each side of the InDel (bp)
  product_size_range: "250-700" # Desired amplicon size range (bp)
  num_return: 3                  # Maximum candidate primer pairs per marker
  optimal_primer_size: 24
  min_primer_size: 18
  max_primer_size: 26
  optimal_tm: 60
  min_tm: 57
  max_tm: 60
  min_gc_percent: 40
  max_gc_percent: 60
  max_ns_accepted: 0
  max_poly_x: 4

strategy1:
  reference: /path/to/reference.fa
  query: /path/to/query.fa
  chromosome: chr1
  preset: asm5
  min_indel_length: 300
  max_indel_length: 500

strategy2:
  reference: /path/to/reference.fa
  parents:
    p1: {r1: /path/to/p1.R1.fastq.gz, r2: /path/to/p1.R2.fastq.gz}
    p2: {r1: /path/to/p2.R1.fastq.gz, r2: /path/to/p2.R2.fastq.gz}
  min_indel_length: 20
  max_indel_length: 100
  genotype_mode: A  # A=0/0 vs 1/1; B also retains strict het-versus-homozygous contrasts
  # Optional per-job limits. By default, P1 and P2 each receive half of `threads`,
  # allowing both parental samples to process concurrently.
  # fastp_threads: 16
  # map_threads: 16
  # call_threads: 8
  # tmpdir: /scratch/$USER/indelmarker

strategy3:
  # Accepts either a standard GFF3 or a BED (the provided B73v5.gene.bed).
  annotation: /path/to/B73v5.gene.bed
  longest_cds_fasta: /path/to/B73v5longest.cds.fa
  chromosome: chr1
  start: 10000000
  end: 20000000
  upstream: 2000
  downstream: 2000
  # Supply genome labels and FASTA paths in your run-specific configuration.
  genomes: {}
