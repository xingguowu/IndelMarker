name: Runnable examples

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate-base: true
      - name: Install the documented environment
        run: |
          # Exercise cluster shells where Conda exists but is absent from PATH.
          example_conda_base="$(conda info --base)"
          echo "INDELMARKER_TEST_CONDA_BASE=$example_conda_base" >> "$GITHUB_ENV"
          export CONDA_EXE="$example_conda_base/bin/conda"
          PATH=/usr/bin:/bin bash scripts/create_conda_env.sh
      - name: Run both suites from a clean checkout
        run: |
          source "$INDELMARKER_TEST_CONDA_BASE/etc/profile.d/conda.sh"
          conda activate indelmarker
          bash scripts/run_examples.sh --suite all --cores 2
      - name: Save example checks and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-validation
          path: |
            demo/work/**/validation.json
            examples/maize/results/**/validation.json
            .snakemake/log/
